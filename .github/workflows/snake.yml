name: Code Battle Arena

on:
  schedule:
    - cron: "0 */6 * * *"  # Updates every 6 hours
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  battle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Battle Stats
        run: |
          # Calculate battle stats based on recent commits
          COMMITS=$(git rev-list --count --since="1 week ago" HEAD)
          ISSUES_CLOSED=$(curl -s "https://api.github.com/repos/Ds7838/Ds7838/issues?state=closed&since=$(date -d '1 week ago' -Iseconds)" | jq length)
          BUGS_FIXED=$((COMMITS + ISSUES_CLOSED))
          PLAYER_HP=$((100 - (BUGS_FIXED * 2)))
          ENEMY_HP=$((20 + (BUGS_FIXED * 3)))
          
          # Create dynamic battle SVG
          cat > battle-arena.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
            <defs>
              <style>
                .battle-text { font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }
                .player { fill: #00ff41; }
                .enemy { fill: #ff4757; }
                .neutral { fill: #ffffff; }
                .damage { animation: shake 0.5s ease-in-out infinite; }
                @keyframes shake {
                  0%, 100% { transform: translateX(0); }
                  25% { transform: translateX(-2px); }
                  75% { transform: translateX(2px); }
                }
              </style>
            </defs>
            
            <!-- Background -->
            <rect width="800" height="400" fill="#0d1117"/>
            
            <!-- Battle Arena -->
            <rect x="50" y="50" width="700" height="300" fill="#161b22" stroke="#30363d" stroke-width="2"/>
            
            <!-- Player Side -->
            <text x="100" y="100" class="battle-text player">PLAYER: DS7838</text>
            <text x="100" y="130" class="battle-text player">HP: ${PLAYER_HP}%</text>
            <text x="100" y="160" class="battle-text player">WEAPON: ⚔️ Clean Code</text>
            
            <!-- Enemy Side -->
            <text x="500" y="100" class="battle-text enemy">ENEMY: BUGS</text>
            <text x="500" y="130" class="battle-text enemy">HP: ${ENEMY_HP}%</text>
            <text x="500" y="160" class="battle-text enemy">TYPE: 🐛 Logic Errors</text>
            
            <!-- Battle Status -->
            <text x="300" y="250" class="battle-text neutral">BATTLE STATUS:</text>
            <text x="250" y="280" class="battle-text player">💥 ${BUGS_FIXED} BUGS DEFEATED!</text>
            <text x="280" y="310" class="battle-text neutral">⚡ COMBO: ${COMMITS}x</text>
          </svg>
          EOF
          
      - name: Commit battle results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Battle Arena Bot"
          git add battle-arena.svg
          git commit -m "🔥 Battle arena updated! Bugs defeated: $BUGS_FIXED" || exit 0
          git push
